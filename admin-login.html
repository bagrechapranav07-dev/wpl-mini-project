<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - TechNest</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1 1%27%3E%3C/svg%3E">
</head>
<body style="background-color: #0f172a;">

  <div class="admin-login-box">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="index.html" class="logo" style="justify-content:center; font-size:1.6rem; color:#1e293b;">
        <div class="logo-icon">💻</div> Tech<span>Nest</span>
      </a>
      <h2 style="font-size: 1.3rem; margin-top: 0.5rem; color: #334155;">Admin Portal Login</h2>
      <p style="font-size: 0.85rem; color: #64748b;">Sign in to view all customer orders, inquiries & repair service responses.</p>
    </div>

    <!-- Credentials callout box for easy testing -->
    <div style="background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 6px; padding: 0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #0369a1;">
      🔑 <strong>Default Login Credentials:</strong><br>
      • Username: <code style="background:#ffffff; padding:0.1rem 0.3rem; border-radius:4px; color:#0f172a; font-weight:700;">admin</code><br>
      • Password: <code style="background:#ffffff; padding:0.1rem 0.3rem; border-radius:4px; color:#0f172a; font-weight:700;">admin123</code>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="adminUser" class="form-control" required value="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-control" required value="admin123">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Log In to Dashboard &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="font-size: 0.85rem; color: #2563eb; text-decoration: underline;">&larr; Back to TechNest Store Front</a>
    </div>
  </div>

  <script src="js/api.js?v=1"></script>
  <script src="js/admin.js?v=6"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;

      if (await performAdminLogin(u, p)) {
        window.location.href = "admin-dashboard.html";
      } else {
        alert("Invalid admin username or password, or the backend is not running.");
      }
    });
  </script>
</body>
</html>
